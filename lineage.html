<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" href="favicon.svg?v=2" type="image/svg+xml">
<link rel="alternate" type="application/ld+json" href="data/lineage.jsonld" title="师承谱系 · JSON-LD">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>师承世表 · 京师学林</title>
<link rel="stylesheet" href="css/shared.css">
<style>
  /* ===== 全屏工作台：整页就是画布，控件浮在图上，页面本身不滚动 ===== */
  html, body { height: 100%; }
  body.app {
    height: 100dvh; overflow: hidden; display: flex; flex-direction: column;
    --header-h: 46px;
    --hud-bg: rgba(255, 254, 251, .86);
    --hud-solid: #fffefb;
    --hud-line: rgba(23, 25, 22, .13);
    --hud-shadow: 0 10px 30px rgba(23, 25, 22, .10);
    --rail-w: 264px;
    --drawer-w: 338px;
    --nav-h: 168px;
    --vermillion: #c92820;
    --jade: #1f8a66;
  }
  body.app.dark {
    --hud-bg: rgba(26, 28, 24, .88);
    --hud-solid: #1c1e1a;
    --hud-line: rgba(255, 255, 255, .11);
    --hud-shadow: 0 12px 34px rgba(0, 0, 0, .5);
    --vermillion: #e0655c;
    --jade: #4cc39a;
  }
  body.app #site-header { position: relative; flex: none; height: auto; }
  body.app .header-inner { max-width: none; padding: 0 14px; gap: 14px; }
  body.app .brand-text em { display: none; }
  body.app .brand .seal { width: 25px; height: 25px; }
  body.app .brand-text strong { font-size: 16px; letter-spacing: 2px; }
  body.app .main-nav { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; height: auto; min-height: 34px; }
  body.app .main-nav::-webkit-scrollbar { display: none; }
  body.app .main-nav a { padding: 0 9px; font-size: 12.5px; white-space: nowrap; }
  body.app.fs #site-header { display: none; }
  #app { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; }

  /* 浮层通用：纸白玻璃 + 一道铜蓝渐变压顶，和站内的印章/铜色/黛蓝同源 */
  .hud {
    position: absolute; z-index: 20;
    background: var(--hud-bg); border: 1px solid var(--hud-line);
    box-shadow: var(--hud-shadow); border-radius: 4px;
    -webkit-backdrop-filter: blur(16px) saturate(1.2);
    backdrop-filter: blur(16px) saturate(1.2);
  }
  .hud-top {
    left: 0; right: 0; top: 0; height: 52px; z-index: 32;
    display: flex; align-items: center; gap: 9px; padding: 0 12px;
    border-radius: 0; border-left: 0; border-right: 0; border-top: 0;
  }
  .hud-top::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px;
    background: linear-gradient(90deg, var(--gold) 0%, var(--gold-bright) 18%, var(--accent) 52%, var(--jade) 84%, var(--vermillion) 100%);
    opacity: .55; pointer-events: none;
  }
  .hud-title { display: flex; align-items: baseline; gap: 9px; flex: 0 1 auto; min-width: 0; overflow: hidden; }
  .hud-title h1 {
    font-family: var(--f-serif); font-size: 17px; font-weight: 700; letter-spacing: 3px;
    margin: 0; color: var(--ink); white-space: nowrap; flex: none;
  }
  .hud-title .lead { font-family: var(--f-sans); font-size: 11px; color: var(--muted); white-space: nowrap; letter-spacing: .2px; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .fs-brand { display: none; align-items: center; gap: 8px; flex: none; }
  body.fs .fs-brand { display: flex; }
  .fs-brand .seal-mini {
    width: 24px; height: 24px; border-radius: 3px; background: var(--seal-bg); color: #fdf9f3;
    font-family: var(--f-serif); font-size: 14px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; flex: none;
  }
  .hud-acts { display: flex; align-items: center; gap: 6px; margin-left: auto; flex: none; }
  .icon-btn {
    width: 30px; height: 30px; flex: none; display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid var(--hud-line); border-radius: 3px; background: transparent;
    color: var(--ink-2); cursor: pointer; font-size: 14px; line-height: 1; font-family: var(--f-sans);
    transition: background .15s var(--ease), color .15s var(--ease), border-color .15s var(--ease);
  }
  .icon-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-wash); }
  .icon-btn.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .icon-btn:focus-visible, .mini-btn:focus-visible, .seg button:focus-visible,
  .ctl input:focus-visible, .fchip:focus-visible, .ns-stat:focus-visible { outline: 2px solid var(--gold-bright); outline-offset: 2px; }
  #btn-legend { display: none; }
  .btn-i { font-style: normal; }
  /* 浮层里的滚动条也走站内配色：纸槽、铜灰滑块、悬停转铜 */
  .panel-bd, .drawer-bd, .stage-legend, .net-pop, .search-pop, .path-bar { scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
  .panel-bd::-webkit-scrollbar, .drawer-bd::-webkit-scrollbar, .stage-legend::-webkit-scrollbar,
  .net-pop::-webkit-scrollbar, .search-pop::-webkit-scrollbar, .path-bar::-webkit-scrollbar { width: 8px; height: 8px; }
  .panel-bd::-webkit-scrollbar-track, .drawer-bd::-webkit-scrollbar-track, .stage-legend::-webkit-scrollbar-track,
  .net-pop::-webkit-scrollbar-track, .search-pop::-webkit-scrollbar-track, .path-bar::-webkit-scrollbar-track { background: transparent; }
  .panel-bd::-webkit-scrollbar-thumb, .drawer-bd::-webkit-scrollbar-thumb, .stage-legend::-webkit-scrollbar-thumb,
  .net-pop::-webkit-scrollbar-thumb, .search-pop::-webkit-scrollbar-thumb, .path-bar::-webkit-scrollbar-thumb {
    background: var(--line-strong); border: 2px solid transparent; background-clip: padding-box; border-radius: 4px;
  }
  .panel-bd::-webkit-scrollbar-thumb:hover, .drawer-bd::-webkit-scrollbar-thumb:hover,
  .net-pop::-webkit-scrollbar-thumb:hover, .search-pop::-webkit-scrollbar-thumb:hover { background: var(--gold); background-clip: padding-box; }
  /* ---- 结构速览：世表的网状结构统计（运行时计算），收在右抽屉里 ---- */
  .net-strip {
    display: flex; flex-direction: column; gap: 5px; align-items: stretch;
    margin: 0; padding: 0; font-size: 12px; color: var(--muted);
    background: none; border: 0;
  }
  .net-strip .ns-t { font-family: var(--f-serif); font-weight: 700; font-size: 12.5px; letter-spacing: 1px; color: var(--ink); }
  .net-strip b { font-family: var(--f-serif); font-size: 14px; color: var(--accent-dark); }
  .net-strip .ns-hint { color: var(--faint); font-size: 11px; line-height: 1.7; }
  .net-wrap { position: relative; }
  .ns-stat { border: 0; background: none; padding: 0; font: inherit; color: inherit; cursor: pointer; border-bottom: 1px dotted var(--line-strong); text-align: left; }
  .ns-stat:hover, .ns-stat[aria-expanded="true"] { color: var(--accent); border-bottom-color: var(--accent); }
  /* 结构发现浮出：从抽屉左缘飞出来压在画布上，不做成模态 */
  .net-pop {
    position: absolute; right: calc(var(--drawer-w) + 26px); top: 64px; z-index: 46;
    width: min(430px, calc(100vw - var(--drawer-w) - 60px));
    background: var(--hud-solid); border: 1px solid var(--hud-line); border-radius: 4px;
    box-shadow: 0 18px 48px rgba(23,25,22,.20); padding: 12px 16px 14px;
    max-height: calc(100% - 130px); overflow: auto; display: none;
  }
  .net-pop .np-hd { display: flex; align-items: center; gap: 10px; margin: 0 0 8px; padding-bottom: 7px; border-bottom: 1px solid var(--line); }
  .net-pop .np-hd h4 { font-family: var(--f-serif); font-size: 13.5px; letter-spacing: 1.5px; margin: 0; color: var(--ink); }
  .net-pop .np-x { margin-left: auto; }
  body.dark .net-pop { background: var(--paper); }
  .net-pop .np-cap { font-size: 12.5px; line-height: 1.75; color: var(--ink-2); margin: 0 0 10px; }
  .net-pop .np-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2); padding: 2.5px 0; }
  .net-pop .np-k { width: 64px; flex: none; }
  .net-pop .np-bar { height: 9px; background: var(--accent); opacity: .8; flex: none; }
  .net-pop .np-item { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 5px 2px; border-bottom: 1px dotted var(--line-soft); cursor: pointer; }
  .net-pop .np-item:hover, .net-pop .np-item:focus-visible { background: var(--accent-wash); outline: none; }
  .net-pop .np-name { font-family: var(--f-serif); font-size: 13px; color: var(--ink); flex: none; }
  .net-pop .np-meta { font-size: 11.5px; color: var(--muted); text-align: right; }
  .net-pop .np-note { font-size: 11.5px; color: var(--muted); margin: 8px 0 0; }
  .hud-top input[type="text"] {
    width: 100%; padding: 7px 12px 7px 32px; border: 1px solid var(--hud-line); border-radius: 3px;
    font-family: var(--f-serif); font-size: 13.5px; background: var(--hud-solid) url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%236d726a' stroke-width='1.6'%3E%3Ccircle cx='10.5' cy='10.5' r='6.5'/%3E%3Cpath d='M20 20l-4.8-4.8'/%3E%3C/svg%3E") no-repeat 10px center;
    color: var(--ink);
  }
  .hud-top input[type="text"]:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-wash); }
  .mini-btn {
    font-family: var(--f-sans); font-size: 11.5px; border: 1px solid var(--hud-line);
    background: transparent; border-radius: 3px; padding: 6px 10px; cursor: pointer; white-space: nowrap;
    color: var(--ink-2); transition: border-color .15s var(--ease), color .15s var(--ease), background .15s var(--ease);
  }
  .mini-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-wash); }
  .mini-btn.primary { border-color: var(--accent); color: var(--accent-dark); background: var(--accent-wash); font-weight: 600; }
  .mini-btn.primary:hover { background: var(--accent); color: #fff; }
  .mini-btn.warn:hover { border-color: var(--vermillion); color: var(--vermillion); background: rgba(201,40,32,.08); }
  .search-wrap { position: relative; flex: 1 1 260px; min-width: 170px; max-width: 420px; }
  .search-pop { position: absolute; left: 0; right: 0; top: calc(100% + 5px); background: var(--hud-solid); border: 1px solid var(--hud-line); border-radius: 3px; box-shadow: 0 16px 40px rgba(23,25,22,.20); max-height: min(330px, 60dvh); overflow: auto; z-index: 40; display: none; }
  .sp-item { display: flex; align-items: baseline; gap: 10px; padding: 8px 12px; cursor: pointer; border-bottom: 1px solid var(--line-soft); }
  .sp-item:last-child { border-bottom: none; }
  .sp-item:hover, .sp-item.on { background: var(--paper-2); }
  .sp-name { font-family: var(--f-serif); font-size: 14px; font-weight: 700; letter-spacing: .5px; }
  .sp-meta { font-family: var(--f-sans); font-size: 11px; color: var(--muted); margin-left: auto; text-align: right; }
  .sp-empty { padding: 12px; font-family: var(--f-sans); font-size: 12.5px; color: var(--muted); }
  /* 更新提示：浮在画布左上、调校栏右侧，不压小地图与缩放 */
  .notice-bar {
    position: absolute; left: calc(var(--rail-w) + 26px); top: 62px; display: none; align-items: center; gap: 8px;
    background: var(--hud-bg); color: var(--muted); border: 1px solid var(--hud-line);
    font-family: var(--f-sans); font-size: 10.5px; border-radius: 3px;
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    padding: 5px 6px 5px 10px; box-shadow: var(--hud-shadow); z-index: 24;
  }
  .notice-bar::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); flex: none; }
  .notice-bar button { background: none; border: none; color: var(--faint); cursor: pointer; font-size: 13px; line-height: 1; padding: 0 4px; }
  .notice-bar button:hover { color: var(--accent); }
  /* 暗色主题 */
  body.dark {
    --bg: #141613; --paper: #1c1e1a; --paper-2: #242721; --ink: #e8e9e3; --ink-2: #c3c6bd;
    --muted: #9ba095; --faint: #767b70; --line: #34372f; --line-soft: #292c26;
    --line-strong: #474b41; --seal-bg: #2a6cbe; --accent: #5b8fd0; --accent-dark: #8fc0f0; --accent-wash: #172430;
    --header-bg: rgba(20, 22, 19, .92);
  }
  body.dark #stage { background-color: #171915; }
  body.dark .stage-hint, body.dark .stage-legend, body.dark .stage-zoom, body.dark .stage-minimap { background: rgba(28,30,26,.94); }
  body.dark .node rect.card-face { fill: var(--paper); stroke: var(--line); }
  body.dark #shitu .node[data-kind="external"] .card-face { fill: var(--paper-2); }
  body.dark #shitu .node:hover .card-face { fill: #22251f; stroke: var(--accent); }
  body.dark #shitu .node.selected .card-face { fill: var(--accent-wash); }
  body.dark .person-head .nm, body.dark .card-name { color: var(--ink); }
  body.dark .card-name { fill: #e8e9e3; }
  body.dark .fold-label { fill: #9ba095; }
  body.dark .tog-face { fill: #242721; stroke: #3d4137; }
  body.dark .card-edge { fill: #b08d3f; }
  body.dark .band-label { fill: #9ba095; stroke: #171915; }
  body.dark line.band-rule { stroke: #34372f; }
  body.dark .notice-bar { background: rgba(28,30,26,.95); color: var(--muted); }
  body.dark .search-pop { background: var(--paper); }
  body.dark .sp-item:hover, body.dark .sp-item.on { background: #242721; }
  body.dark .hud-top input[type="text"], body.dark .mini-btn, body.dark .fchip { background-color: #1c1e1a; color: var(--ink); }
  body.dark .mini-btn.primary { background-color: var(--accent-wash); color: var(--accent-dark); }
  body.dark .icon-btn { color: var(--ink-2); }
  body.dark .icon-btn.on { color: #10130f; }
  body.dark rect.band-bg { fill: rgba(255,255,255,.035); }
  body.dark .rel-item, body.dark .side-card, body.dark .card-face { background: transparent; }
  .switch { font-family: var(--f-sans); font-size: 11.5px; color: var(--muted); display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
  .switch input { accent-color: var(--accent); }
  /* 画布铺满整个工作区：没有盒式版面、没有页脚，页面本身不滚动 */
  #stage {
    position: absolute; inset: 0; overflow: hidden;
    background-color: #f7f8f5;
    cursor: grab; touch-action: none;
  }
  /* 方格纸纹可关：让大片留白有质感，又不抢走细线的注意力 */
  #stage.grid {
    background-image:
      repeating-linear-gradient(0deg, rgba(23,25,22,.028) 0 1px, transparent 1px 28px),
      repeating-linear-gradient(90deg, rgba(23,25,22,.028) 0 1px, transparent 1px 28px);
  }
  /* 两团极淡的色雾缓慢漂移：铜色自左上、黛蓝自右下，给长卷一点空气感 */
  #stage::before {
    content: ""; position: absolute; inset: -20%; pointer-events: none; z-index: 0;
    background:
      radial-gradient(38% 44% at 22% 18%, rgba(176,141,63,.13), transparent 70%),
      radial-gradient(42% 48% at 82% 88%, rgba(29,79,140,.12), transparent 72%),
      radial-gradient(30% 36% at 62% 42%, rgba(31,138,102,.07), transparent 70%);
    animation: drift 46s ease-in-out infinite alternate;
  }
  #stage::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 1;
    box-shadow: inset 0 0 140px rgba(23,25,22,.07);
  }
  body.dark #stage::before {
    background:
      radial-gradient(38% 44% at 22% 18%, rgba(176,141,63,.16), transparent 70%),
      radial-gradient(42% 48% at 82% 88%, rgba(91,143,208,.16), transparent 72%),
      radial-gradient(30% 36% at 62% 42%, rgba(31,138,102,.09), transparent 70%);
  }
  body.dark #stage::after { box-shadow: inset 0 0 160px rgba(0,0,0,.45); }
  @keyframes drift {
    from { transform: translate3d(-2%, -1%, 0) scale(1); }
    to   { transform: translate3d(3%, 2%, 0) scale(1.08); }
  }
  @media (prefers-reduced-motion: reduce) { #stage::before { animation: none; } }
  #stage.dragging { cursor: grabbing; }
  #shitu { display: block; position: relative; z-index: 2; }

  /* ---- 左栏：常驻视图调校 + 图例 ---- */
  .hud-left {
    position: absolute; left: 12px; top: 64px; bottom: 52px; width: var(--rail-w);
    display: flex; flex-direction: column; gap: 10px; z-index: 22;
    transition: transform .28s var(--ease), opacity .22s var(--ease);
  }
  body.rail-off .hud-left { transform: translateX(calc(-100% - 20px)); opacity: 0; pointer-events: none; }
  /* 桌面收起调校栏时图例留在原位：筛线型是看图的一部分，不该跟着控件一起消失 */
  @media (min-width: 901px) {
    body.rail-off .hud-left { transform: none; opacity: 1; }
    body.rail-off .ctl { transform: translateX(calc(-100% - 20px)); opacity: 0; pointer-events: none; }
    body.rail-off .stage-legend { pointer-events: auto; }
    body.rail-off #btn-legend { display: none; }
  }
  .ctl { transition: transform .28s var(--ease), opacity .22s var(--ease); }
  .panel {
    background: var(--hud-bg); border: 1px solid var(--hud-line); border-radius: 4px;
    box-shadow: var(--hud-shadow); display: flex; flex-direction: column; min-height: 0;
    -webkit-backdrop-filter: blur(16px) saturate(1.2); backdrop-filter: blur(16px) saturate(1.2);
  }
  .panel-hd {
    display: flex; align-items: center; gap: 8px; flex: none;
    padding: 8px 10px; border-bottom: 1px solid var(--hud-line);
  }
  .panel-hd h3 {
    font-family: var(--f-serif); font-size: 12.5px; font-weight: 700; letter-spacing: 2px;
    margin: 0; color: var(--ink);
  }
  .panel-hd .hd-x { margin-left: auto; }
  .panel-bd { padding: 10px; overflow: auto; min-height: 0; }
  .ctl { flex: 1 1 auto; }
  .ctl-grp { margin-bottom: 7px; }
  .ctl-lab {
    display: flex; align-items: baseline; gap: 8px; margin-bottom: 3px;
    font-family: var(--f-sans); font-size: 11px; color: var(--ink-2); letter-spacing: .4px;
  }
  .ctl-lab output {
    margin-left: auto; font-size: 10.5px; color: var(--accent-dark);
    font-variant-numeric: tabular-nums; font-weight: 600;
  }
  /* 滑杆走站内配色：铜色轨道槽 + 黛蓝滑块，不用浏览器默认灰 */
  .ctl input[type="range"] {
    -webkit-appearance: none; appearance: none; width: 100%; height: 14px;
    background: transparent; cursor: pointer; display: block; margin: 0;
  }
  .ctl input[type="range"]::-webkit-slider-runnable-track {
    height: 4px; border-radius: 2px;
    background: linear-gradient(90deg, var(--gold) 0%, var(--accent) 100%); opacity: .38;
  }
  .ctl input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 13px; height: 13px; margin-top: -4.5px;
    border-radius: 50%; background: var(--hud-solid); border: 2px solid var(--accent);
    box-shadow: 0 1px 4px rgba(23,25,22,.28); transition: transform .12s var(--ease);
  }
  .ctl input[type="range"]:hover::-webkit-slider-thumb { transform: scale(1.18); border-color: var(--gold-bright); }
  .ctl input[type="range"]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--line-strong); }
  .ctl input[type="range"]::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--accent); }
  .ctl input[type="range"]::-moz-range-thumb {
    width: 11px; height: 11px; border-radius: 50%; background: var(--hud-solid);
    border: 2px solid var(--accent); box-shadow: 0 1px 4px rgba(23,25,22,.28);
  }
  .seg { display: flex; gap: 0; border: 1px solid var(--hud-line); border-radius: 3px; overflow: hidden; }
  .seg button {
    flex: 1 1 0; border: 0; background: transparent; cursor: pointer; padding: 5px 4px;
    font-family: var(--f-sans); font-size: 11px; color: var(--muted); letter-spacing: .5px;
    border-right: 1px solid var(--hud-line); transition: background .15s var(--ease), color .15s var(--ease);
  }
  .seg button:last-child { border-right: 0; }
  .seg button:hover { color: var(--accent); background: var(--accent-wash); }
  .seg button.on { background: var(--accent); color: #fff; font-weight: 600; }
  body.dark .seg button.on { color: #10130f; }
  .ctl-toggles { display: grid; grid-template-columns: 1fr 1fr; gap: 5px 8px; margin: 9px 0 8px; padding-top: 8px; border-top: 1px solid var(--hud-line); }
  /* 四个动作钉在面板底：滑杆再多、面板再矮，随机 / 重置 / 导出都不必先滚动才够得着 */
  .ctl-acts {
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
    position: sticky; bottom: -10px; z-index: 2;
    margin: 0 -10px -10px; padding: 10px;
    background: var(--hud-solid); border-top: 1px solid var(--hud-line);

  /* ---- 图例：左栏底部，可筛线型 ---- */
  .stage-legend {

    box-shadow: var(--hud-shadow); padding: 8px 10px; font-family: var(--f-sans);

  /* ---- 右抽屉：节点信息 / 主要家族 / 结构速览，点卡片滑出 ---- */

  .side-card h3 { font-family: var(--f-serif); font-size: 12.5px; margin: 0 0 10px; color: var(--ink); letter-spacing: 2px; padding-bottom: 7px; border-bottom: 1px solid var(--line); }
  .side-card .empty { color: var(--muted); font-size: 12.5px; margin: 0; line-height: 1.9; }

  /* ---- 右下：小地图 + 缩放 + 三个视图动作 ---- */
  .hud-nav {

  .stage-zoom { display: flex; gap: 2px; align-items: center; background: var(--hud-solid); border: 1px solid var(--hud-line); border-radius: 3px; padding: 2px 3px; }
  .stage-zoom button { border: none; background: none; font-size: 14px; cursor: pointer; font-family: var(--f-sans); color: var(--ink-2); padding: 3px 9px; line-height: 1.2; }

  .stage-zoom .pct { font-family: var(--f-sans); font-size: 10.5px; color: var(--muted); flex: 1; text-align: center; font-variant-numeric: tabular-nums; }

  /* ---- 底部状态条：视野里有多少人、展开到哪、悬停是谁 ---- */
  .hud-status {
    position: absolute; left: 12px; right: 232px; bottom: 12px; height: 30px; z-index: 21;
    display: flex; align-items: center; gap: 12px; padding: 0 11px; overflow: hidden;

  .hud-status .st-links { margin-left: auto; display: flex; gap: 10px; flex: none; }
  .hud-status .st-links a { color: var(--muted); border-bottom: 1px dotted var(--line-strong); }
  .hud-status .st-links a:hover { color: var(--accent); border-bottom-color: var(--accent); }
  .hud-status .st-keys { color: var(--faint); }
  .hud-status .st-keys kbd {
    font-family: var(--f-sans); font-size: 9.5px; border: 1px solid var(--hud-line);
    border-bottom-width: 2px; border-radius: 3px; padding: 0 3px; margin: 0 1px; color: var(--ink-2);
  }
  /* 轻提示：随机访一位 / 导出成功这类一次性反馈 */
  .toast {
    position: absolute; left: 50%; bottom: 54px; transform: translate(-50%, 8px); z-index: 50;
    background: var(--hud-solid); border: 1px solid var(--hud-line); border-left: 3px solid var(--gold);
    border-radius: 3px; box-shadow: 0 14px 36px rgba(23,25,22,.20);
    padding: 8px 14px; font-family: var(--f-sans); font-size: 12px; color: var(--ink);
    opacity: 0; pointer-events: none; transition: opacity .22s var(--ease), transform .22s var(--ease);
    max-width: min(440px, calc(100% - 40px));
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.err { border-left-color: var(--vermillion); }
  .person-head { display: flex; align-items: center; gap: 11px; margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--line-soft); }
  .person-head .avatar { width: 40px; height: 40px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 16px; }
  .person-head .avatar.has-img { background: var(--paper-2); overflow: hidden; box-shadow: 0 0 0 1px var(--line); }
  .person-head .avatar.has-img img { width: 100%; height: 100%; object-fit: cover; object-position: var(--focus, 50% 20%); display: block; }
  .person-head .nm { font-family: var(--f-serif); font-size: 19px; font-weight: 700; letter-spacing: 1.5px; }
  .person-head .meta { font-family: var(--f-sans); font-size: 11.5px; color: var(--muted); line-height: 1.65; }
  .rel-block { margin-top: 14px; }
  .rel-block .rb-title { font-family: var(--f-sans); font-size: 11px; font-weight: 600; letter-spacing: 1.4px; color: var(--muted); margin-bottom: 4px; padding-bottom: 4px; border-bottom: 1px solid var(--line-soft); }
  .rel-item { border: 0; border-bottom: 1px solid var(--line-soft); border-radius: 0; padding: 8px 0; margin-bottom: 0; font-size: 13px; background: transparent; }
  .rel-item .ri-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .rel-item .ri-name { font-family: var(--f-serif); font-weight: 700; letter-spacing: .6px; }
  .rel-item .ri-type { font-family: var(--f-sans); font-size: 10px; color: var(--green); background: rgba(31,138,102,.08); border: 0; border-radius: 2px; padding: 0 6px; line-height: 1.7; }
  .rel-item .ri-weak { font-family: var(--f-sans); font-size: 10px; color: var(--gold-deep); background: var(--gold-wash); border: 1px solid #e7d9bc; border-radius: 2px; padding: 0 6px; }
  .rel-item .ri-ev { color: var(--muted); font-size: 12px; margin-top: 4px; line-height: 1.7; }
  .rel-item .ri-ev-note { display: block; margin-top: 2px; font-size: 11px; color: var(--faint); }
  .rel-item .ri-grade { color: var(--muted); background: var(--paper); border-color: var(--line-strong); }
  /* 传承载体：这门学问当年靠什么方式往下走，取自证据原文，没有就整行不出现 */
  .rel-item .ri-channel { font-size: 12px; margin-top: 4px; line-height: 1.7; color: var(--ink-soft, #4a4a4a); }
  .rel-item .ri-channel b { font-family: var(--f-sans); font-size: 10px; font-weight: 600; letter-spacing: .5px; color: var(--accent); margin-right: 4px; }
  .rel-item .ri-ev a { word-break: break-all; color: var(--muted); text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 2px; }
  .rel-item .ri-ev a:hover { color: var(--accent); }
  .ext-note { font-family: var(--f-sans); font-size: 11.5px; color: var(--gold-deep); background: var(--gold-wash); border: 1px solid #e7d9bc; border-radius: 2px; padding: 8px 10px; margin-top: 8px; line-height: 1.75; }
  .family-chips { display: flex; gap: 4px 14px; flex-wrap: wrap; }
  .fchip { font-family: var(--f-serif); font-size: 12.5px; border: 0; border-bottom: 1px dotted var(--line-strong); background: transparent; border-radius: 0; padding: 2px 0; cursor: pointer; color: var(--ink-2); }
  .fchip:hover { border-bottom-color: var(--accent); color: var(--accent); }
  .fchip.on { background: transparent; border-bottom: 1px solid var(--accent); color: var(--accent); font-weight: 600; }
  .tour-card { position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%); background: var(--hud-solid); border: 1px solid var(--hud-line); border-left: 3px solid var(--gold); border-radius: 4px; padding: 14px 18px; box-shadow: 0 18px 44px rgba(23,25,22,.22); z-index: 44; max-width: min(360px, calc(100% - 32px)); }
  .tour-card .tour-step { font-family: var(--f-sans); font-size: 10px; letter-spacing: 1.5px; color: var(--faint); }
  .tour-card .tour-title { font-family: var(--f-serif); font-size: 15px; font-weight: 700; margin: 4px 0 4px; color: var(--ink); letter-spacing: 1px; }
  .tour-card .tour-text { font-size: 12.5px; color: var(--muted); line-height: 1.75; margin-bottom: 10px; }
  .tour-card .tour-skip { background: none; border: none; font-family: var(--f-sans); font-size: 11.5px; color: var(--muted); cursor: pointer; margin-left: 10px; }
  .tour-card .tour-skip:hover { color: var(--accent); }
  /* 深链定位条：?id= 进入时告诉来访者「在看谁、祖链展到哪」，并链回首页章黄叙事 */
  #deep-bar { position: absolute; top: 64px; left: 50%; transform: translateX(-50%); z-index: 45; display: flex; align-items: center; gap: 12px; background: var(--hud-solid); border: 1px solid var(--hud-line); border-radius: 4px; padding: 8px 10px 8px 14px; box-shadow: 0 10px 30px rgba(23, 25, 22, .16); max-width: min(92vw, 760px); font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }
  #deep-bar[hidden] { display: none; }
  #deep-bar b { font-family: var(--f-serif); font-size: 14px; color: var(--ink); letter-spacing: .5px; }
  #deep-bar .db-tag { font-family: var(--f-sans); font-size: 10px; letter-spacing: 1.5px; color: var(--gold); border: 1px solid var(--gold); border-radius: 2px; padding: 1px 7px; margin-right: 8px; }
  #deep-bar a { color: var(--accent); text-decoration: none; }
  #deep-bar a:hover { text-decoration: underline; }
  #deep-bar-close { background: none; border: 0; font-size: 15px; line-height: 1; color: var(--muted); cursor: pointer; padding: 2px 4px; }
  #deep-bar-close:hover { color: var(--accent); }
  body.dark #deep-bar { background-color: #1c1e1a; color: #c9cdc2; }
  @media (max-width: 900px) { #deep-bar { top: 58px; } }
  @media (max-width: 720px) { #deep-bar { left: 12px; right: 12px; transform: none; flex-wrap: wrap; white-space: normal; } }
  .node.pop { animation: cardIn .4s ease; }
  @keyframes cardIn { from { opacity: 0; } to { opacity: 1; } }
  .card-name { font-family: var(--f-serif); font-size: 14px; fill: var(--ink); font-weight: 600; letter-spacing: .6px; }
  .card-name.latin { font-family: var(--f-sans); letter-spacing: 0; }
  .card-sub { font-family: var(--f-sans); font-size: 9px; fill: var(--faint); letter-spacing: .4px; font-variant-numeric: tabular-nums; }
  .fold-label { font-family: var(--f-sans); font-size: 9.5px; fill: var(--muted); }
  .tog-face { fill: var(--paper-2); stroke: var(--line); stroke-width: 1; }
  .card-edge { fill: var(--gold); }
  /* 路径查询栏：浮在画布下缘居中，不占版面 */
  .path-bar {
    position: absolute; left: 50%; bottom: 52px; transform: translateX(-50%); z-index: 34;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    width: min(780px, calc(100% - 24px)); padding: 9px 12px;
    background: var(--hud-bg); border: 1px solid var(--hud-line); border-radius: 4px;
    box-shadow: var(--hud-shadow); font-family: var(--f-sans); font-size: 12px;
    -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
  }
  .path-bar .pb-label { color: var(--accent-dark); font-weight: 600; letter-spacing: 1px; flex: none; }
  .path-bar input { width: 128px; padding: 5px 8px; font: inherit; font-size: 12px;
    border: 1px solid var(--hud-line); border-radius: 3px; background: var(--hud-solid); color: var(--ink); }
  .path-bar input:focus { outline: none; border-color: var(--accent); }
  .path-bar .pb-arrow { color: var(--faint); }
  .path-bar .pb-result { color: var(--ink); line-height: 1.9; flex: 1 1 200px; min-width: 0; }
  .path-bar .pb-result .hop { color: var(--muted); font-size: 11px; margin: 0 4px; }
  .path-bar .pb-result b { color: var(--accent-dark); font-family: var(--f-serif); letter-spacing: .5px; }
  /* 路径高亮：非路径节点淡出 */
  #shitu.path-mode .node:not(.on-path) { opacity: .13; }
  #shitu.path-mode .node.on-path .card-face { fill: #fbf3dd; stroke: #c9a227; stroke-width: 1.5; }
  #shitu .node.on-bridge .card-face { fill: #fbf3dd; stroke: #c9a227; stroke-width: 1.5; }
  .card-bridge-dot { cursor: pointer; }
  .toggle:focus, .card-bridge-dot:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  #shitu.path-mode .edge-hit { pointer-events: none; }
  /* 流动圆点：干线/母线上滚动的粒子，方向师→生。
     周期固定 8px（负向推进＝沿路径方向，循环无缝），只调点长与速度，改周期会跳帧。 */
  #shitu { --flow-dur: 1.43s; --flow-dot: .4px; --edge-scale: 1; }
  @keyframes edgeflow { to { stroke-dashoffset: -8; } }
  .edge-flow {
    fill: none; stroke-linecap: round;
    stroke-dasharray: var(--flow-dot) calc(8px - var(--flow-dot));
    stroke-width: calc(2.2px * var(--edge-scale));
    animation: edgeflow var(--flow-dur) linear infinite;
    pointer-events: none;
  }
  #shitu.flow-off .edge-flow { display: none; }
  #shitu .edge-line { stroke-width: calc(var(--w, 1.2) * var(--edge-scale) * 1px); }
  #shitu .edge-trunk { stroke-width: calc(1px * var(--edge-scale)); }
  /* 路径高亮时流动退为氛围层，不与金色路径抢注意力 */
  #shitu.path-mode .edge-flow { opacity: .12; }
  @media (prefers-reduced-motion: reduce) {
    .edge-flow { display: none; }
  }
  /* 卡片常驻纸白卡面：人名要成「一张名片」，不是一列浮字 */
  #shitu .node .card-face { fill: var(--paper); stroke: var(--line); stroke-width: 1; }
  #shitu .node[data-kind="external"] .card-face { fill: var(--paper-2); stroke-dasharray: 3 2; }
  #shitu .node:hover .card-face { stroke: var(--accent); stroke-width: 1.2; }
  #shitu .node:hover .card-name { fill: var(--accent-dark); }
  #shitu .node:hover .tog-face { fill: var(--accent-wash); stroke: var(--accent); }
  #shitu .node:focus-visible { outline: 2px solid #c9a227; outline-offset: 2px; }
  #shitu .node:hover .toggle .fold-label { fill: var(--accent-dark); }
  /* 选中态：点了哪张卡，图上要看得出来。 */
  #shitu .node.selected .card-face { fill: var(--accent-wash); stroke: var(--accent); stroke-width: 1.4; }
  #shitu .node.selected .card-name { fill: var(--accent-dark); }
  /* 轮廓模式：缩到 30% 以下时隐藏文字，只留色块与连线，避免糊成噪点 */
  #shitu.overview .card-name,
  #shitu.overview .card-sub,
  #shitu.overview .fold-label,
  #shitu.overview .toggle { display: none; }
  #shitu.overview .card-face { fill: #d9dbd5; stroke: none; opacity: .75; }
  #shitu.overview .node[data-kind="master"] .card-face { fill: #c9a227; opacity: .8; }
  #shitu.overview .node[data-kind="external"] .card-face { fill: #c7cac2; opacity: .6; }
  .band-label {
    font-family: var(--f-sans); font-size: 10.5px; fill: var(--muted); letter-spacing: 1px;
    /* 纸色描边做光晕：年代标签压在卡片/连线上时仍然可读 */
    paint-order: stroke; stroke: #f7f8f5; stroke-width: 3px; stroke-linejoin: round;
  }
  body.dark #shitu.overview .card-face { fill: #3a3d35; }
  body.dark #shitu.overview .node[data-kind="master"] .card-face { fill: #8a6d3b; }
  /* 中等屏：收窄两栏，把画布让出来 */
  @media (max-width: 1180px) {
    body.app { --rail-w: 232px; --drawer-w: 304px; }
    .hud-title .lead { display: none; }
    .hud-status .st-keys { display: none; }
    .net-pop { width: min(380px, calc(100vw - var(--drawer-w) - 50px)); }
  }
  @media (max-width: 900px) {
    body.app { --sheet-h: max(31dvh, 190px); --nav-h: 0px; }

    .hud-title { display: none; }
    .search-wrap { flex: 1 1 110px; min-width: 100px; max-width: none; }
    .hud-top input[type="text"] { font-size: 12.5px; padding: 6px 9px 6px 29px; }
    .hud-acts { gap: 4px; }
    .hud-acts .btn-t { display: none; }
    .hud-acts .mini-btn { padding: 6px 8px; font-size: 13px; }
    #btn-legend { display: inline-flex; }
    /* 调校栏变成常驻底部工作台：不藏进弹窗，横竖都够得着 */
    .hud-left {
      left: 0; right: 0; bottom: 0; top: auto; width: auto;
      height: var(--sheet-h); gap: 0; border-radius: 0;
      background: var(--hud-bg); border-top: 1px solid var(--hud-line);
      box-shadow: 0 -12px 32px rgba(23,25,22,.14);
      -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
    }
    body.rail-off .hud-left { transform: translateY(calc(100% + 20px)); }
    .ctl { flex: 1 1 auto; border: 0; border-radius: 0; box-shadow: none; background: none; -webkit-backdrop-filter: none; backdrop-filter: none; }
    .ctl .panel-hd { padding: 6px 10px; }
    .ctl .panel-bd { display: grid; grid-template-columns: 1fr 1fr; gap: 9px 14px; align-content: start; padding: 9px 10px 12px; }
    .ctl-grp { margin-bottom: 0; }
    .ctl-toggles, .ctl-acts { grid-column: 1 / -1; margin: 2px 0 0; padding-top: 8px; }
    .ctl-toggles { grid-template-columns: 1fr 1fr; }
    .ctl-acts {
      grid-template-columns: repeat(4, 1fr);
      bottom: -12px; margin: 2px -10px -12px; padding: 8px 10px 12px;
    }
    .rail-open { left: 8px; top: auto; bottom: 8px; }
    body.rail-off .rail-open { bottom: 8px; }
    /* 图例改浮出：底部工作台里塞不下，也不该塞 */
    .stage-legend {
      display: none; position: fixed; left: 8px; right: 8px; bottom: calc(var(--sheet-h) + 10px);
      max-height: 40dvh; z-index: 42; background: var(--hud-solid);
    }
    body.legend-on .stage-legend { display: block; }
    body.rail-off .stage-legend { bottom: 52px; }
    .hud-right {
      left: 8px; right: 8px; top: 54px; bottom: calc(var(--sheet-h) + 10px); width: auto;
      transform: translateY(-14px);
    }
    body.rail-off .hud-right { bottom: 52px; }
    .hud-right.open { transform: none; }
    .hud-nav { right: 8px; bottom: calc(var(--sheet-h) + 10px); width: 148px; padding: 6px; }
    .stage-minimap { display: none; }
    .nav-views { flex-direction: column; }
    .hud-status { left: 8px; right: 164px; bottom: calc(var(--sheet-h) + 10px); height: 26px; padding: 0 9px; }
    .hud-status .st-links, .hud-status .st-keys { display: none; }
    body.rail-off .hud-nav, body.rail-off .hud-status { bottom: 10px; }
    .notice-bar { display: none !important; }
    .path-bar { bottom: calc(var(--sheet-h) + 44px); width: calc(100% - 16px); max-height: 34dvh; overflow: auto; }
    .path-bar input { width: 104px; }
    .tour-card { bottom: calc(var(--sheet-h) + 48px); }
    .toast { bottom: calc(var(--sheet-h) + 12px); }
    .net-pop { left: 8px; right: 8px; top: auto; bottom: calc(var(--sheet-h) + 12px); width: auto; max-height: 48dvh; }
    body.rail-off .path-bar, body.rail-off .tour-card, body.rail-off .toast, body.rail-off .net-pop { bottom: 52px; }
  }
  @media (max-width: 340px) {

<script>
(function () {
  const data = window.LINEAGE_DATA;
  const headerHost = document.getElementById("site-header");
  headerHost.innerHTML = BNU.header("lineage.html");
  // 页眉在窄屏会折成两行，高度交给内容，再回写变量，别让锚点偏移用着一个假数
  const syncHeaderH = () => document.body.style.setProperty("--header-h", headerHost.offsetHeight + "px");
  syncHeaderH();
  window.addEventListener("resize", syncHeaderH);
  // 全屏工作台不放页脚：出处与口径改挂在底部状态条上，画布一寸不让
  const esc = BNU.esc;
  // 图形用色跟随主题：夜间换浅蓝，金、绿、灰不动
  const accent = () => document.body.classList.contains("dark") ? "#5b8fd0" : "#1d4f8c";
  const SVGNS = "http://www.w3.org/2000/svg";
  const nodeById = {};
  data.nodes.forEach(n => { nodeById[n.id] = n; });

  /* ================= 关系线型与颜色 ================= */
  const REL_STYLE = {
    "博士":        { dash: null,      w: 1.1, get color() { return accent(); }, label: "博士" },
    "硕士":        { dash: null,      w: 1.0, color: "#1f8a66", label: "硕士" },
    "博士后":      { dash: null,      w: 1.0, color: "#4f7a80", label: "博士后" },
    "受业":        { dash: "6,3",     w: 1.0, color: "#8a6d3b", label: "受业" },
    "就学期间受教": { dash: "3,3",     w: 1.0, color: "#8a6d3b", label: "就学受教" },
    "问学":        { dash: "1,3",     w: 1.2, color: "#4f7a80", label: "问学" },
    "硕士、博士":   { dash: null,      w: 1.0, get color() { return accent(); }, label: "硕博同门" },
    "研究生":      { dash: null,      w: 1.0, get color() { return accent(); }, label: "研究生" },
  };
  function relStyle(type) {
    if (REL_STYLE[type]) return REL_STYLE[type];
    for (const k of Object.keys(REL_STYLE)) {
      if (type.indexOf(k) === 0) return REL_STYLE[k];
    }
    return { dash: null, w: 1.2, color: "#857f77", label: type.slice(0, 5) };
  }
  const relTypes = [...new Set(data.edges.map(e => e.type))].sort((a, b) => a.localeCompare(b, "zh"));
  const relHidden = {};

  const ORG_STATUS = {
    scholar:  { get color() { return accent(); }, hollow: false, label: "本校任职" },
    master:   { color: "#b08d3f", hollow: false, label: "先贤（曾执教本校）" },
    external: { color: "#9aa0a6", hollow: true,  label: "他处任职 / 外源" },
  };

  /* ================= 顶部一句话 ================= */
  const directEdges = data.edges.filter(e => e.strength === "直接").length;
  const gradeTally = BNU.gradeTally(data.edges);
  const leadEl = document.getElementById("lead");
  // 顶栏只留读得懂的四项；证据分级与同事关系的细账挂在悬停提示与「结构」抽屉里
  leadEl.textContent =
    data.stats.edges + " 条师承 · " + data.stats.scholarNodes + " 位本库学者 · " +
    data.stats.masterNodes + " 位先贤 · " + data.stats.externalNodes + " 位库外导师";
  leadEl.title =
    data.stats.edges + " 条师承关系 · " + data.stats.scholarNodes + " 位本库学者 · " +
    data.stats.masterNodes + " 位先贤 · " + data.stats.externalNodes + " 位外源导师 · " +
    "证据分级 强 " + gradeTally["强"] + " · 中 " + gradeTally["中"] + " · 弱 " + gradeTally["弱"] + "（默认隐藏） · " +
    directEdges + " 条直接证据 · " + data.stats.colleagueEdges + " 条同事关系（可叠加）";

  /* ================= 布局（仿 mulu：折叠 + 树形分层 + 直角连线） =================
     核心规则：只有「自己也带学生」的学者才展开为姓名卡片；
     纯学生折叠成导师卡片下方的「门下 N」开关，不画连线——图面因此稀疏清晰。 */
  const q = document.getElementById("q");
  const onlyDirect = document.getElementById("only-direct");
  const hideWeak = document.getElementById("hide-weak");
  const showColleague = document.getElementById("show-colleague");
  let familyMentor = null;

  function visibleEdge(e) {
    if (relHidden[e.type]) return false;
    if (onlyDirect.checked && e.strength !== "直接") return false;
    if (hideWeak.checked && BNU.edgeGrade(e) === "弱") return false;
    if (familyMentor && e.mentor !== familyMentor && e.student !== familyMentor) return false;
    return true;
  }

  const childrenOf = {}, mentorsOf = {};
  data.nodes.forEach(n => { childrenOf[n.id] = []; mentorsOf[n.id] = []; });
  data.edges.forEach(e => {
    if (nodeById[e.student] && nodeById[e.mentor]) {
      childrenOf[e.mentor].push(e.student);
      mentorsOf[e.student].push(e.mentor);
    }
  });

  /* ---- 结构速览：并查集算家族、数根、数桥，全部运行时计算不写死 ---- */
  const NET = {};
  (function netStrip() {
    const N = data.nodes, E = data.edges;
    const inG = new Set(); E.forEach(e => { inG.add(e.mentor); inG.add(e.student); });
    const p = {}; inG.forEach(id => { p[id] = id; });
    const find = x => { while (p[x] !== x) { p[x] = p[p[x]]; x = p[x]; } return x; };
    E.forEach(e => { const a = find(e.mentor), b = find(e.student); if (a !== b) p[a] = b; });
    const fam = {}; inG.forEach(id => { const r = find(id); (fam[r] = fam[r] || []).push(id); });
    const fams = Object.values(fam).sort((a, b) => b.length - a.length);
    const big = fams[0] || [];
    const bigSet = new Set(big);
    const hasPar = {}; E.forEach(e => { if (bigSet.has(e.student)) hasPar[e.student] = true; });
    const rootCount = big.filter(id => !hasPar[id]).length;
    const byStu = {}; E.forEach(e => { (byStu[e.student] = byStu[e.student] || new Set()).add(e.mentor); });
    const multi = Object.values(byStu).filter(s => s.size > 1).length;
    const kind = {}; N.forEach(n => { kind[n.id] = n.kind; });
    const extEdges = E.filter(e => kind[e.mentor] === "external").length;
    const strip = document.getElementById("net-strip");
    if (!strip) return;
    NET.fams = fams; NET.byStu = byStu;
    strip.innerHTML =
      `<button class="ns-stat" type="button" data-key="fam" aria-expanded="false" aria-controls="net-pop"><b>${fams.length}</b> 个师承家族</button>` +
      `<span>最大分量 <b>${big.length}</b> 人、<b>${rootCount}</b> 个独立源头——多个师门粘连，不是一棵树</span>` +
      `<button class="ns-stat" type="button" data-key="bridge" aria-expanded="false" aria-controls="net-pop"><b>${multi}</b> 位学者师从多人（桥）</button>` +
      `<button class="ns-stat" type="button" data-key="ext" aria-expanded="false" aria-controls="net-pop"><b>${(extEdges / E.length * 100).toFixed(1)}%</b> 的边导师在库外</button>` +
      `<span class="ns-hint">点数字看发现 · 卡片右上 ◆＝兼师从，点击定位另一位导师</span>`;
  })();

  /* ---- 结构发现面板：点速览条数字弹出（家族规模 / 桥名单 / 外源边年代），全部运行时计算 ---- */
  const netPop = document.getElementById("net-pop");
  let netPopKey = null;

  function netFindings() {
    if (NET.cache) return NET.cache;
    const nm = {}, kd = {};
    data.nodes.forEach(n => { nm[n.id] = n.name; kd[n.id] = n.kind; });
    const par = {};
    data.edges.forEach(e => { if (!par[e.student]) par[e.student] = e.mentor; });
    // 每族最深代数：记忆化 DFS（防环）
    const kids = {};
    data.edges.forEach(e => (kids[e.mentor] = kids[e.mentor] || []).push(e.student));
    const depth = {}, inS = {};
    const dfs = x => {
      if (depth[x] != null) return depth[x];
      if (inS[x]) return 1;
      inS[x] = true;
      let m = 1;
      (kids[x] || []).forEach(s => { m = Math.max(m, 1 + dfs(s)); });
      inS[x] = false;
      return depth[x] = m;
    };
    NET.fams.forEach(f => f.forEach(id => dfs(id)));
    const buckets = [
      { label: "16 人以上", test: s => s >= 16 },
      { label: "6–15 人", test: s => s >= 6 && s <= 15 },
      { label: "3–5 人", test: s => s >= 3 && s <= 5 },
      { label: "2 人", test: s => s === 2 },
      { label: "1 人", test: s => s === 1 },
    ];
    const famRows = buckets.map(b => ({ label: b.label, n: NET.fams.filter(f => b.test(f.length)).length })).filter(r => r.n > 0);
    let chainFams = 0, maxD = 0, deepTop = null;
    NET.fams.forEach(f => {
      let md = 0, top = null;
      f.forEach(id => { const dv = dfs(id); if (dv > md) { md = dv; top = id; } });
      if (md >= 3) chainFams++;
      if (md > maxD) { maxD = md; deepTop = top; }
    });
    let deepRoot = deepTop;
    const seenUp = new Set();
    while (deepRoot && par[deepRoot] && !seenUp.has(deepRoot)) { seenUp.add(deepRoot); deepRoot = par[deepRoot]; }
    // 桥名单：按导师数降序
    const bridges = Object.entries(NET.byStu)
      .filter(([, s]) => s.size > 1)
      .map(([id, s]) => ({ id, name: nm[id] || id, n: s.size, ms: [...s].map(m => nm[m] || m) }))
      .sort((a, b) => b.n - a.n || nm[a.id].localeCompare(nm[b.id], "zh"));
    // 外源边年代分布 + 带徒最多的外源导师
    const dec = {}; let extNoYear = 0; const extCnt = {};
    data.edges.forEach(e => {
      if (kd[e.mentor] !== "external") return;
      if (e.year) { const k = Math.floor(e.year / 10) * 10; dec[k] = (dec[k] || 0) + 1; }
      else extNoYear++;
      extCnt[e.mentor] = (extCnt[e.mentor] || 0) + 1;
    });
    const decRows = Object.keys(dec).map(k => ({ dec: +k, n: dec[k] })).sort((a, b) => a.dec - b.dec);
    const mxExt = Math.max(0, ...Object.values(extCnt));
    const extTop = Object.keys(extCnt).filter(id => extCnt[id] === mxExt).map(id => nm[id]).sort((a, b) => a.localeCompare(b, "zh"));
    NET.cache = { famRows, chainFams, maxD, deepRoot: nm[deepRoot] || "", bridges, decRows, extNoYear, extTop };
    return NET.cache;
  }

  const NET_TITLES = { fam: "家族规模分布", bridge: "兼师从的桥", ext: "库外导师的年代" };
  function renderNetPop(key) {
    const F = netFindings();
    if (key === "fam") {
      const mx = Math.max(...F.famRows.map(r => r.n));
      netPop.innerHTML =
        `<p class="np-cap">按连通分量统计的 ${NET.fams.length} 个家族的规模分布。没有一人孤族——最小的家族也有一对师徒；多数师承仍是点对点，成链（三代以上）仅 ${F.chainFams} 族，最深 ${F.maxD} 代（${esc(F.deepRoot)}一脉）。</p>` +
        F.famRows.map(r => `<div class="np-row"><span class="np-k">${r.label}</span><span class="np-bar" style="width:${Math.max(4, Math.round(r.n / mx * 260))}px"></span><span>${r.n} 族</span></div>`).join("");
    } else if (key === "bridge") {

      netPop.innerHTML =

        F.bridges.map(b => `<div class="np-item" data-id="${esc(b.id)}" tabindex="0" role="button" aria-label="定位 ${esc(b.name)}"><span class="np-name">${esc(b.name)}</span><span class="np-meta">${b.n} 位导师：${esc(b.ms.join("、"))}</span></div>`).join("");
    } else {
      const mx = Math.max(...F.decRows.map(r => r.n));
      const peak = F.decRows.reduce((a, b) => (b.n > a.n ? b : a), F.decRows[0]);
      const recent = F.decRows.filter(r => r.dec >= 1990 && r.dec <= 2010).reduce((s, r) => s + r.n, 0);
      netPop.innerHTML =
        `<p class="np-cap">导师在库外的师承边，按年代分布。峰值在 ${peak.dec} 年代（${peak.n} 条），1990—2010 年代合计 ${recent} 条——在录学者外校求学的高峰期。带徒最多的外源导师：${esc(F.extTop.join("、"))}。</p>` +
        F.decRows.map(r => `<div class="np-row"><span class="np-k">${r.dec}s</span><span class="np-bar" style="width:${Math.max(4, Math.round(r.n / mx * 260))}px"></span><span>${r.n} 条</span></div>`).join("") +
        (F.extNoYear ? `<p class="np-note">另有 ${F.extNoYear} 条外源边年份待补，未计入分布。</p>` : "");
    }
    netPop.innerHTML =
      `<div class="np-hd"><h4>${esc(NET_TITLES[key] || "结构发现")}</h4>` +
      `<button class="icon-btn np-x" id="net-pop-close" aria-label="关闭结构发现">×</button></div>` +
      netPop.innerHTML;
    document.getElementById("net-pop-close").addEventListener("click", closeNetPop);
  }

  function openNetPop(key) {
    if (netPopKey === key) { closeNetPop(); return; }
    netPopKey = key;
    renderNetPop(key);
    netPop.style.display = "block";
    document.querySelectorAll("#net-strip .ns-stat").forEach(b => b.setAttribute("aria-expanded", b.dataset.key === key ? "true" : "false"));
  }
  function closeNetPop() {
    netPopKey = null;
    netPop.style.display = "none";
    document.querySelectorAll("#net-strip .ns-stat").forEach(b => b.setAttribute("aria-expanded", "false"));
  }
  document.getElementById("net-strip").addEventListener("click", ev => {
    const btn = ev.target.closest(".ns-stat");

  netPop.addEventListener("click", ev => {

  document.addEventListener("mousedown", ev => {

  // 卡片集合（动态）：有门下的（导师）或无导师的（谱系根）为基础卡片；
  // 点击导师可将其折叠的门下学生「展开弹出」为卡片（仿 mulu 交互）
  const expanded = new Set();   // 已展开门下的导师 id
  let effCard = {};             // 当前生效的卡片集合（随展开状态重算）
  let popIds = new Set();       // 本次展开新增的卡片（播放入场动画）
  const nodeEl = {};            // id -> 卡片 <g>，路径高亮时用
  let pathIds = new Set();      // 当前高亮的路径节点
  let bridgeIds = new Set();    // 兼师从定位高亮（点卡片右上角 ◆ 触发，与路径高亮互不干扰）
  let selectedId = null;        // 当前选中的卡片（render 里用来画金色外框，必须在使用前声明）

  let cards = [];
  const X = {}, Y = {};
  // 几何量改成可调：左栏「视图调校」实时改这些值再 relayout，不是写死的常量
  let CW = 96, CH = 46, GAP = 16, BAND_H = 118;
  const TOG_H = 26;
  const BAND_BASE = 1975, BAND_STEP = 5;
  const DENSITY = { loose: { gap: 30, band: 156 }, normal: { gap: 16, band: 118 }, tight: { gap: 7, band: 84 } };
  const TUNE_DEFAULT = { card: "full", density: "normal", band: 118, gap: 16, flow: 14, dot: 4, edge: 100, ew: 10, grid: true };
  let tune = Object.assign({}, TUNE_DEFAULT);
  const layout = { contentW: 0, contentH: 0 };
  let mainParentMap = {};   // 主父映射：多导师的学生只挂一个主父（其余为次父边，弱化显示）

  // 重算布局（展开/收起后调用）——森林布局：每棵家族树独立排布、树间留隙，
  // 同一导师的学生紧贴其下，不同家族不穿插（仿 mulu 的清晰结构）
  function relayout() {
    effCard = {};
    data.nodes.forEach(n => { effCard[n.id] = n.asMentor > 0 || mentorsOf[n.id].length === 0; });
    expanded.forEach(tid => childrenOf[tid].forEach(s => { effCard[s] = true; }));

    // 主父：多导师学生的归属树（取其导师列表中的第一个）
    mainParentMap = {};
    data.nodes.forEach(n => {
      if (!effCard[n.id]) return;
      const ps = mentorsOf[n.id].filter(m => effCard[m]);
      mainParentMap[n.id] = ps.length ? ps[0] : null;
    });
    // 防环：沿主父链检测，成环则断开为根
    data.nodes.forEach(n => {
      if (!effCard[n.id]) return;
      const seen = new Set([n.id]);
      let p = mainParentMap[n.id];
      while (p != null) {
        if (seen.has(p)) { mainParentMap[n.id] = null; break; }
        seen.add(p);
        p = mainParentMap[p];
      }
    });
    const childrenMain = {};
    cards = data.nodes.filter(n => effCard[n.id]);
    cards.forEach(n => {
      const p = mainParentMap[n.id];
      if (p == null) return;
      (childrenMain[p] = childrenMain[p] || []).push(n.id);
    });

    // ===== 布局（mulu 结构三合一）=====
    // 纵轴 = 年代带（自适应 5 年分带，年份待补置顶）；横轴 = 家族树展开；
    // 树（家族块）按其最早成员年份从左到右定位——年代骨架 + 家族聚簇。
    for (const k in X) delete X[k];
    for (const k in Y) delete Y[k];
    function bandOf(n) {
      if (!n.year) return -1;   // 年份待补带置顶（仿 mulu）
      return Math.floor((n.year - BAND_BASE) / BAND_STEP);
    }
    const bks = [...new Set(cards.map(bandOf))].sort((a, b) => a - b);
    const bandIdx = {};
    bks.forEach((k, i) => { bandIdx[k] = i; });
    layout.bands = bks;

    // 递归子树布局：返回 {width, minYear, place(baseX)}；父居中于学生卡片
    function layoutSub(id) {
      const kids = childrenMain[id] || [];
      const subs = kids.map(layoutSub);
      let w = 0;
      const offs = subs.map(sub => { const o = w; w += sub.width + GAP; return o; });
      if (subs.length) w -= GAP;
      w = Math.max(w, CW);
      const cx = subs.length
        ? (offs[0] + offs[offs.length - 1] + CW) / 2 - CW / 2
        : (w - CW) / 2;
      const selfYear = nodeById[id].year || 9999;
      const minYear = subs.length ? Math.min(selfYear, ...subs.map(s => s.minYear)) : selfYear;
      return {
        width: w, minYear,
        place(bx) {
          X[id] = bx + cx;
          Y[id] = bandIdx[bandOf(nodeById[id])] * BAND_H;
          subs.forEach((sub, i) => sub.place(bx + offs[i]));
        },
      };
    }
    // 家族树（根）按其最早成员年份排序——年代越早越靠左（mulu 的 block 定位规则）
    const roots = cards.filter(c => mainParentMap[c.id] == null)
      .sort((a, b) => (bandOf(a) - bandOf(b)) || a.name.localeCompare(b.name, "zh"));
    // 左侧留出年代标尺的空白，避免年代标签压在卡片姓名上
    let bx = 84;
    roots.forEach(r => {
      const t = layoutSub(r.id);
      t.place(bx);
      bx += t.width + GAP * 3;   // 家族树之间留大间隙
    });

    // 代际修正：父子同带（或倒挂）时父上移一带——否则父居中于唯一孩子会完全重合
    let minY = Infinity;
    function fixY(id) {
      const kids = childrenMain[id] || [];
      kids.forEach(fixY);
      if (kids.length) {
        const minKidY = Math.min(...kids.map(k => Y[k]));
        if (Y[id] >= minKidY) Y[id] = minKidY - BAND_H;
      }
      minY = Math.min(minY, Y[id]);
    }
    roots.forEach(r => fixY(r.id));
    if (minY < 0) {   // 上移产生负 y：整体下移，保持画布内
      const shift = -minY;
      Object.keys(Y).forEach(k => { Y[k] += shift; });
    }

    layout.contentW = bx + 60;
    layout.contentH = (Math.max(...Object.values(Y), 0) + CH + TOG_H + 60);
  }

  // 展开/收起某导师的门下（点击卡片触发）
  function toggleExpand(tid) {
    setTimeout(saveState, 0);
    popIds = new Set();
    // 展开会改变子树宽度，整张图跟着横移——不锚住的话，点完那张卡就跑出视野了
    const sx = X[tid] != null ? view.x + X[tid] * view.k : null;
    const sy = Y[tid] != null ? view.y + Y[tid] * view.k : null;
    const opening = !expanded.has(tid);
    const reanchor = () => {
      if (sx == null || X[tid] == null) return;
      if (opening) {
        // 展开：把「导师＋刚露出来的学生」整组框进视口。师承年代差二三十年时，
        // 只锚住导师会让学生全落在屏幕下方，看出去的还是一片空线。
        const group = [tid].concat(cards.filter(c => mainParentMap[c.id] === tid).map(c => c.id));
        const gx = group.map(id => X[id]).filter(v => v != null);
        const gy = group.map(id => Y[id]).filter(v => v != null);
        const L = Math.min(...gx) - 24, R = Math.max(...gx) + CW + 24;
        const T = Math.min(...gy) - 24, B = Math.max(...gy) + CH + TOG_H + 24;
        const cr = clearRect();
        const aw = cr.r - cr.l, ah = cr.b - cr.t;
        view.k = Math.max(0.62, Math.min(view.k, aw / (R - L), ah / (B - T)));
        // 兜底缩放后仍装不下时，优先保证刚点的那张卡完整可见，剩下的靠拖拽
        const gw = (R - L) * view.k, gh = (B - T) * view.k;
        view.x = gw <= aw ? cr.l + (aw - gw) / 2 - L * view.k : cr.l + aw / 2 - (X[tid] + CW / 2) * view.k;
        view.y = gh <= ah ? cr.t + (ah - gh) / 2 - T * view.k : cr.t - T * view.k;
      } else {
        view.x = sx - X[tid] * view.k;
        view.y = sy - Y[tid] * view.k;
      }
      applyView();
    };
    if (opening) {
      expanded.add(tid);
      childrenOf[tid].forEach(s => { if (!effCard[s]) popIds.add(s); });
      relayout();
      // 主父口径检测：展开后没有任何学生挂在本导师树下（学生全是别人的主父学生）
      // → 「死钮」：撤销展开，改为定位到学生实际所在位置（其主导师树下）
      const underMe = cards.filter(c => mainParentMap[c.id] === tid);
      if (!underMe.length && childrenOf[tid].length) {
        expanded.delete(tid);
        relayout();
        locateSecondary(tid);
        return;
      }
      render();
      reanchor();
    } else {
      expanded.delete(tid);
      relayout();
      render();
      reanchor();
    }
  }


  function cardX(n) { return X[n.id] || 0; }
  function cardY(n) { return Y[n.id] || 0; }
  const CJK = /[一-龥]/;
  // 显示名：中文去括注取本名；外文取「首字母. 姓」，有中文译名的用译名。
  // 不能按字数截断——slice(0,4) 会把 Alexandra Aikhenvald 切成「Alex」，图上认不出是谁。
  function dispName(n) {
    const raw = String(n.name || "").trim();
    const head = raw.split("（")[0].trim();
    if (CJK.test(head)) return head.slice(0, 5);
    const cn = raw.match(/（([^）]+)）/);
    if (cn && CJK.test(cn[1])) return cn[1].trim().slice(0, 5);
    const parts = head.split(/\s+/).filter(Boolean);
    return parts.length > 1 ? parts[0][0].toUpperCase() + ". " + parts[parts.length - 1] : head;
  }
  // 折叠开关：有折叠中的学生，或已展开且确有门下——两者都没有时不画
  function hasToggle(n) {
    const kids = childrenOf[n.id] || [];
    return kids.some(s => !effCard[s]) || (expanded.has(n.id) && kids.length > 0);
  }
  // 姓名宽度用 canvas 量：SVG 在轮廓模式下 display:none，getComputedTextLength 会返回 0
  const measurer = document.createElement("canvas").getContext("2d");
  const FONT_CJK = '600 14px "Source Han Serif SC","Noto Serif SC","Songti SC","STSong","SimSun",Georgia,serif';
  const FONT_LAT = '600 10.5px "Source Han Sans SC","Noto Sans SC","PingFang SC","Hiragino Sans GB",sans-serif';
  // 简牌把任职点与兼师从角标压到同一行，姓名可用宽度要再让出 12px，否则会撞上角标
  const nameMax = () => CW - (tune.card === "compact" ? 30 : 18);
  function nameW(nm, latin) {
    measurer.font = latin ? FONT_LAT : FONT_CJK;
    return measurer.measureText(nm).width + (latin ? 0 : nm.length * 0.6);
  }
  // 外文名先试「首字母. 姓」，放不下就只留姓——宁可少一个首字母，也不要把字号压到 8px
  function nameFont(nm) {
    const latin = !CJK.test(nm);
    const base = latin ? 10.5 : 14;
    const MAX = nameMax();
    let text = nm, w = nameW(text, latin);
    if (latin && w > MAX && nm.includes(". ")) {
      const sur = nm.slice(nm.indexOf(". ") + 2);
      const sw = nameW(sur, true);
      if (sw < w) { text = sur; w = sw; }
    }
    return { text, latin, size: w > MAX ? Math.max(8, base * MAX / w) : base };
  }

  /* ================= 视图 ================= */
  const svg = document.getElementById("shitu");
  const stage = document.getElementById("stage");
  const view = { x: 0, y: 0, k: 1 };
  let gRoot = null;
  let gEdgesEl = null, gColleagueEl = null;

  function applyView() {
    if (gRoot) gRoot.setAttribute("transform", "translate(" + view.x + "," + view.y + ") scale(" + view.k + ")");
    // 缩得太小时文字变成噪点，切「轮廓模式」：只留色块与线，不画字
    const ov = view.k < 0.30;
    const svg = document.getElementById("shitu");
    if (svg) svg.classList.toggle("overview", ov);
    const pct = Math.round(view.k * 100);
    document.getElementById("zoom-pct").textContent = pct + "%";
    const zs = document.getElementById("ctl-zoom");
    if (zs && document.activeElement !== zs) zs.value = String(Math.min(300, Math.max(12, pct)));
    const zo = document.getElementById("out-zoom");
    if (zo) zo.textContent = pct + "%";
    if (typeof drawMinimap === "function" && gRoot) drawMinimap();
    updateStatus();
    if (typeof saveState === "function") saveState();
  }

  /* ---- 底部状态条：视野里到底看得见几个人，比缩放百分比更有用 ---- */
  let hoverName = "";
  function updateStatus() {
    const vis = document.getElementById("st-vis");
    if (!vis) return;
    const w = stage.clientWidth, h = stage.clientHeight;
    let n = 0;
    for (let i = 0; i < cards.length; i++) {
      const id = cards[i].id;
      if (X[id] == null || Y[id] == null) continue;
      const sx = view.x + X[id] * view.k, sy = view.y + Y[id] * view.k;
      if (sx + CW * view.k > 0 && sx < w && sy + CH * view.k > 0 && sy < h) n++;
    }
    vis.textContent = String(n);
    document.getElementById("st-exp").textContent = String(expanded.size);
    document.getElementById("st-hover").textContent = hoverName;
  }

  /* ---- 调校参数落到画布：CSS 变量管线与粒子，几何量管布局 ---- */
  function applyTune() {
    CH = tune.card === "compact" ? 30 : 46;
    GAP = tune.gap; BAND_H = tune.band;
    if (tune.flow > 0) svg.style.setProperty("--flow-dur", (2.0 / (tune.flow / 10)).toFixed(2) + "s");
    svg.style.setProperty("--flow-dot", (tune.dot / 10).toFixed(1) + "px");
    svg.style.setProperty("--edge-scale", (tune.ew / 10).toFixed(2));
    svg.classList.toggle("flow-off", tune.flow === 0);
    stage.classList.toggle("grid", tune.grid);
    // 浓度直接改组透明度：拖滑杆时不必重绘上千个图元
    if (gEdgesEl) gEdgesEl.style.opacity = String(tune.edge / 100);
    if (gColleagueEl) gColleagueEl.style.opacity = String(tune.edge / 100);
  }
  // 改几何时保住视野中心：不然拖一下「年代带高」，正在看的那一脉就跑了
  function retune(relayoutToo) {
    const w = stage.clientWidth, h = stage.clientHeight;
    const cx = (w / 2 - view.x) / view.k, cy = (h / 2 - view.y) / view.k;
    applyTune();
    if (relayoutToo) relayout();
    render();
    view.x = w / 2 - cx * view.k;
    view.y = h / 2 - cy * view.k;
    applyView();
  }
  // 看全高：k 取「视口高 / 内容高」，横向仍可拖，但所有年代带都在视野内
  function fitFullHeight() {
    const w = stage.clientWidth, h = stage.clientHeight;
    view.k = Math.max(0.18, Math.min(1.1, h / layout.contentH * 0.96));
    view.x = viewPad().left;
    view.y = Math.max(8, (h - layout.contentH * view.k) / 2);
    applyView();
  }
  function fitView() {
    const w = stage.clientWidth, h = stage.clientHeight;
    // 世表是横向长卷（宽高比十几比一），真按「两边都塞下」算会缩到 4%，卡片薄成一条虚线。
    // 兜到 12%：整体分布仍看得见，横向继续拖。
    view.k = Math.max(0.12, Math.min(1.1, Math.min(w / layout.contentW, h / layout.contentH) * 0.94));
    view.x = Math.max(10, (w - layout.contentW * view.k) / 2);
    view.y = Math.max(10, (h - layout.contentH * view.k) / 2);
    applyView();
  }
  // 浮层之间的「净空」：顶栏、调校栏、抽屉、状态条都压在画布上，
  // 默认视野与展开取景都按这块矩形算，人才不会一开机就躲在浮层底下
  function clearRect() {
    const sr = stage.getBoundingClientRect();
    const w = sr.width, h = sr.height;
    const wide = window.matchMedia("(min-width: 901px)").matches;
    let l = 16, t = 64, r = w - 16, b = h - 50;
    if (!document.body.classList.contains("rail-off")) {
      const rr = document.querySelector(".hud-left").getBoundingClientRect();
      if (rr.width > 2) {
        if (wide) l = Math.max(l, rr.right - sr.left + 16);
        else b = Math.min(b, rr.top - sr.top - 12);
      }
    }
    const dr = document.getElementById("drawer");
    if (wide && dr.classList.contains("open")) {
      r = Math.min(r, dr.getBoundingClientRect().left - sr.left - 16);
    }
    return { l, t, r: Math.max(r, l + 140), b: Math.max(b, t + 140) };
  }
  function viewPad() {
    const cr = clearRect();
    return { left: cr.l + 8, top: cr.t };
  }
  // 默认视图：接近 100%（卡片清晰可读），锚定到最早有人物的年代带；靠拖拽/小地图浏览长卷
  function fitHeight() {
    const w = stage.clientWidth, h = stage.clientHeight;
    const pad = viewPad();
    // 卡片改成横排姓名后字号是硬指标：窄屏再降档就低于 11px 读不动了，宁可少看几列
    view.k = w < 560 ? 0.82 : (w < 900 ? 0.9 : 0.95);
    const roots = data.nodes.filter(n => effCard[n.id] && mainParentMap[n.id] == null && X[n.id] != null)
      .sort((a, b) => X[a.id] - X[b.id]);
    const anchor = roots[0] || data.nodes.find(n => effCard[n.id] && X[n.id] != null);
    view.x = anchor ? Math.min(pad.left, w / 2 - (X[anchor.id] + CW / 2) * view.k) : pad.left;
    // 纵向不要锚在 1920 那种空年代带上：把「当前横向窗口里最靠上的一张卡」顶到净空上沿，
    // 首屏直接看到人和线，而不是半屏空白（空带仍可通过拖拽/看全高回看）
    const x0 = (0 - view.x) / view.k, x1 = (w - view.x) / view.k;
    const ys = data.nodes
      .filter(n => effCard[n.id] && Y[n.id] != null && X[n.id] >= x0 - 60 && X[n.id] <= x1)
      .map(n => Y[n.id]);
    view.y = ys.length ? pad.top - Math.min(...ys) * view.k : 30;
    applyView();
  }
  function zoomAt(cx, cy, factor) {
    const k2 = Math.min(3, Math.max(0.12, view.k * factor));
    const r = stage.getBoundingClientRect();
    const mx = cx - r.left, my = cy - r.top;
    view.x = mx - (mx - view.x) * (k2 / view.k);
    view.y = my - (my - view.y) * (k2 / view.k);
    view.k = k2;
    applyView();
  }
  stage.addEventListener("wheel", e => {
    e.preventDefault();
    zoomAt(e.clientX, e.clientY, e.deltaY < 0 ? 1.12 : 0.89);
  }, { passive: false });
  let drag = null;
  // 触摸/鼠标统一用 Pointer Events：单指拖拽平移，双指捏合缩放
  const pointers = new Map();
  let pinch = null;
  stage.addEventListener("pointerdown", e => {
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 2) {            // 第二根手指落下 → 进入捏合
      const [a, b] = [...pointers.values()];
      pinch = {
        dist: Math.hypot(a.x - b.x, a.y - b.y) || 1,
        k: view.k, vx: view.x, vy: view.y,
        cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2,
      };
      drag = null;
      stage.classList.remove("dragging");
      return;
    }
    if (e.target.closest(".node")) return;
    if (e.target.closest("button")) return;
    if (e.target.closest(".stage-legend")) return;
    drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y };
    stage.classList.add("dragging");
    stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener("pointermove", e => {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 2 && pinch) {   // 捏合缩放：以两指中点为锚
      const [a, b] = [...pointers.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y) || 1;
      const cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2;
      const nextK = Math.max(0.05, Math.min(2.6, pinch.k * (d / pinch.dist)));
      const s2 = nextK / pinch.k;
      view.k = nextK;
      view.x = cx - (cx - pinch.vx) * s2;
      view.y = cy - (cy - pinch.vy) * s2;
      applyView();
      return;
    }
    if (!drag) return;
    view.x = drag.vx + (e.clientX - drag.x);
    view.y = drag.vy + (e.clientY - drag.y);
    applyView();
  });
  const endPointer = e => {
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinch = null;
    drag = null;
    stage.classList.remove("dragging");
  };
  stage.addEventListener("pointerup", endPointer);
  stage.addEventListener("pointercancel", endPointer);
  stage.addEventListener("pointerleave", e => { if (e.pointerType === "touch") endPointer(e); });

  /* ================= 渲染 ================= */
  function isExtNode(n) { return n.kind === "external"; }
  function el(tag, attrs, parent) {
    const e = document.createElementNS(SVGNS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }

  function render() {
    svg.innerHTML = "";
    svg.setAttribute("width", stage.clientWidth);
    svg.setAttribute("height", stage.clientHeight);
    gRoot = el("g", {}, svg);
    const gBands = el("g", {}, gRoot), gColleague = el("g", {}, gRoot),
          gEdges = el("g", {}, gRoot), gNodes = el("g", {}, gRoot);
    // 连线浓度整组调，不去改每条边自己的 opacity——那套值还要留给悬停增亮用
    gEdgesEl = gEdges; gColleagueEl = gColleague;
    gEdges.style.opacity = String(tune.edge / 100);
    gColleague.style.opacity = String(tune.edge / 100);

    // 年代带背景（隔带底纹）+ 左侧年代标签（mulu 的年代骨架）
    layout.bands.forEach((k, i) => {
      const y = i * BAND_H;
      if (i % 2 === 0) {
        el("rect", { x: 0, y: y - 14, width: layout.contentW, height: BAND_H - 6, fill: "rgba(23,25,22,.022)", "class": "band-bg" }, gBands);
      }
      el("line", { x1: 0, y1: y - 14, x2: layout.contentW, y2: y - 14, stroke: "#dcded7", "stroke-width": 0.8, "class": "band-rule" }, gBands);
      // 标签放在左侧留白里：x < 84，与卡片列完全错开
      const lt = el("text", { x: 10, y: y + 26, "class": "band-label" }, gBands);
      lt.textContent = k === -1 ? "年份待补" : (BAND_BASE + k * BAND_STEP) + "—" + (BAND_BASE + k * BAND_STEP + BAND_STEP - 1);
    });

    // 同事关系（可选叠加：浅灰细线最底层）
    if (showColleague.checked) {
      (data.colleagueEdges || []).forEach(ce => {
        const a = nodeById[ce.a], b = nodeById[ce.b];
        if (!a || !b || !effCard[a.id] || !effCard[b.id]) return;
        if (familyMentor && ce.a !== familyMentor && ce.b !== familyMentor) return;
        const ax = cardX(a) + CW / 2, ay = cardY(a) + CH / 2;
        const bx = cardX(b) + CW / 2, by = cardY(b) + CH / 2;
        el("line", { x1: ax, y1: ay, x2: bx, y2: by, stroke: "#9aa0a6", "stroke-width": 0.8, opacity: 0.25 }, gColleague);
      });
    }

    // 师承连线（mulu 的总线式布线）：导师的垂直干线汇入带间通道，横走后垂下到各学生——
    // 同一导师的多条边共享干线，视觉上是地铁图而非蜘蛛网
    const byParent = {};
    data.edges.forEach(e => {
      if (!visibleEdge(e)) return;
      const s = nodeById[e.student], m = nodeById[e.mentor];
      if (!effCard[s.id] || !effCard[m.id]) return;
      (byParent[e.mentor] = byParent[e.mentor] || []).push(e);
    });
    Object.keys(byParent).forEach(mid => {
      const m = nodeById[mid];
      const trunkX = cardX(m) + CW / 2;
      const yTop = cardY(m) + CH + (hasToggle(m) ? TOG_H : 0) + 2;
      const segs = byParent[mid].map(e => {
        const s = nodeById[e.student];
        return { sx: cardX(s) + CW / 2, sy: cardY(s) - 4, e, s };
      });
      const trunkColor = relStyle(segs[0].e.type).color;
      // 公交式母线：导师下方先拉一条横向总线，每个学生各自从母线垂下。
      // 以前的「一条干线通到底 + 逐级横走」会让干线穿过同门卡片，看起来像父子链；
      // 改成并联后，平辈关系一眼可辨（干线的竖段不再经过任何人的卡片）。
      const busY = yTop + 10;
      // 母线只连「主父是本导师」的学生；学生的另一个导师（次父）单独走一条淡色通道，
      // 否则一个次父学生就能把母线拉成横贯全图的线。
      const mainSegs = segs.filter(g => mainParentMap[g.e.student] === mid);
      const secSegs = segs.filter(g => mainParentMap[g.e.student] !== mid);
      const busXs = mainSegs.map(g => g.sx).concat([trunkX]);
      const busL = Math.min(...busXs), busR = Math.max(...busXs);
      // 导师 → 母线的短竖线
      el("line", { x1: trunkX, y1: yTop, x2: trunkX, y2: busY, stroke: trunkColor, "class": "edge-trunk", opacity: 0.6 }, gEdges);
      // 横向母线（只有跨列时才画）
      if (busR - busL > 0.5) {
        el("line", { x1: busL, y1: busY, x2: busR, y2: busY, stroke: trunkColor, "class": "edge-trunk", opacity: 0.6 }, gEdges);
      }
      // 流动圆点叠加层：只铺在干线与母线上（非每条分支），粒子从导师处向外流——师→生
      const flow = { "class": "edge-flow", stroke: trunkColor, opacity: 0.5 };
      el("line", { ...flow, x1: trunkX, y1: yTop, x2: trunkX, y2: busY }, gEdges);
      // 母线分两半、起点都定在干线处：负向 dashoffset 即从干线向两侧推进
      if (busR - trunkX > 0.5) el("line", { ...flow, x1: trunkX, y1: busY, x2: busR, y2: busY }, gEdges);
      if (trunkX - busL > 0.5) el("line", { ...flow, x1: trunkX, y1: busY, x2: busL, y2: busY }, gEdges);
      // 次父通道：比母线低 12px 的独立水平线，虚线 + 更淡
      const secY = busY + 12;
      if (secSegs.length) {
        const secXs = secSegs.map(g => g.sx).concat([trunkX]);
        el("line", { x1: Math.min(...secXs), y1: secY, x2: Math.max(...secXs), y2: secY,
                     stroke: "#8a6d3b", "class": "edge-trunk", "stroke-dasharray": "3,3", opacity: 0.3 }, gEdges);
        el("line", { x1: trunkX, y1: busY, x2: trunkX, y2: secY, stroke: "#8a6d3b", "class": "edge-trunk", "stroke-dasharray": "3,3", opacity: 0.3 }, gEdges);
      }
      // 各分支：从母线的学生自己那一列垂下
      segs.forEach(seg => {
        const st = relStyle(seg.e.type);
        const isMain = mainParentMap[seg.e.student] === mid;
        const weak = BNU.edgeGrade(seg.e) === "弱";
        const op = (isMain ? 0.8 : 0.4) * (weak ? 0.55 : 1);
        const baseY = isMain ? busY : secY;
        const d = "M " + seg.sx + " " + baseY + " L " + seg.sx + " " + seg.sy;
        const path = el("path", {
          d: d, fill: "none", stroke: weak ? "#b9beb6" : (isExtNode(m) ? "#9aa0a6" : st.color),
          "class": "edge-line", "stroke-dasharray": weak ? "2,4" : (isExtNode(m) ? "3,3" : (st.dash || "none")),
          opacity: op, cursor: "pointer",
        }, gEdges);
        path.style.setProperty("--w", st.w);   // 线宽倍数走 CSS 变量，保留各关系类型自己的粗细差
        path.style.pointerEvents = "stroke";
